<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ลงสินค้าขาย eBay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-10">

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🃏</span>
                <h1 class="text-lg font-semibold tracking-wide">ลงสินค้าขาย eBay (การ์ด & ของสะสม)</h1>
            </div>
            <span class="text-xs bg-white/20 px-2 py-1 rounded-full">Auto-Queue</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4">
        
        <!-- Success Alert -->
        <div id="successBox" class="hidden bg-emerald-50 border border-emerald-300 text-emerald-800 p-4 rounded-2xl mb-4 text-center shadow-sm">
            <div class="text-4xl mb-1">🎉</div>
            <h3 class="font-bold text-lg">บันทึกเข้าคิวสำเร็จ!</h3>
            <p class="text-sm text-emerald-600 mt-1" id="successMsg">ระบบได้รับข้อมูลสินค้าและรูปภาพเรียบร้อยแล้ว</p>
            <button onclick="resetForm()" class="mt-3 bg-emerald-600 text-white text-sm px-4 py-2 rounded-xl font-medium shadow active:scale-95 transition">
                + เพิ่มสินค้าชิ้นต่อไป
            </button>
        </div>

        <form id="itemForm" class="space-y-4" enctype="multipart/form-data">

            <!-- Section 1: Photos -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <label class="block font-semibold text-slate-700 mb-2 flex items-center justify-between">
                    <span>📸 รูปภาพการ์ด (หน้า-หลัง-มุมต่างๆ)</span>
                    <span id="photoCount" class="text-xs font-normal text-slate-400">0 รูป</span>
                </label>
                
                <label class="flex flex-col items-center justify-center border-2 border-dashed border-indigo-200 rounded-xl p-5 cursor-pointer bg-indigo-50/40 hover:bg-indigo-50 transition active:scale-[0.99]">
                    <div class="text-3xl text-indigo-500 mb-1">📷</div>
                    <span class="text-sm font-medium text-indigo-700">แตะเพื่อเลือกรูปภาพ</span>
                    <span class="text-xs text-slate-400 mt-0.5">เลือกหน้า-หลัง และมุมการ์ดพร้อมกันได้เลย</span>
                    <input type="file" id="imageInput" multiple accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                </label>

                <!-- Preview Grid -->
                <div id="previewGrid" class="grid grid-cols-3 gap-2 mt-3"></div>
            </div>

            <!-- Section 2: Title -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-1">
                    <label class="font-semibold text-slate-700">🏷️ ชื่อสินค้า / ชื่อการ์ด (Title)</label>
                    <span id="titleCounter" class="text-xs text-slate-400">0/80</span>
                </div>
                <input type="text" id="title" required maxlength="80" 
                    placeholder="เช่น Pokemon Charizard VMAX SSR Shiny / One Piece Luffy SP" 
                    class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                    oninput="updateTitleCount()">
                <p class="text-[11px] text-slate-400 mt-1">ใส่วงเล็บสภาพตอนท้ายได้ เช่น [NM] หรือ [PSA 10]</p>
            </div>

            <!-- Section 3: Card Condition (มาตรฐานสากล eBay สำหรับการ์ดสะสม) -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <label class="block font-semibold text-slate-700 mb-1">🔍 สภาพการ์ด (Card Condition)</label>
                <select id="condition" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700 font-medium" onchange="toggleGradedFields()">
                    <optgroup label="การ์ดดิบ (Ungraded / Raw)">
                        <option value="Near Mint or Better (NM)">💎 Near Mint or Better (NM) - กริบ ไร้รอย</option>
                        <option value="Lightly Played (LP/EX)">✨ Lightly Played (LP) - รอยขนแมว/ขอบขาวเล็กน้อย</option>
                        <option value="Moderately Played (MP/VG)">👌 Moderately Played (MP) - มีรอยขอบ/รอยเล่น</option>
                        <option value="Heavily Played (HP)">⚠️ Heavily Played (HP) - สภาพผ่านศึก รอยเห็นชัด</option>
                        <option value="Damaged (DMG)">❌ Damaged (DMG) - มีรอยยับ พับ หรือหัก</option>
                    </optgroup>
                    <optgroup label="การ์ดเกรดแล้ว (Graded)">
                        <option value="Graded - PSA">🏆 ส่งเกรดแล้ว (PSA)</option>
                        <option value="Graded - BGS">🏆 ส่งเกรดแล้ว (BGS / Beckett)</option>
                        <option value="Graded - CGC">🏆 ส่งเกรดแล้ว (CGC)</option>
                        <option value="Graded - Other">🏆 ส่งเกรดแล้ว (สถาบันอื่นๆ / ARS)</option>
                    </optgroup>
                </select>

                <!-- ช่องกรอกคะแนนเกรด (ซ่อนอยู่ จะโชว์เมื่อเลือกการ์ดเกรด) -->
                <div id="gradedBox" class="hidden mt-3 p-3 bg-amber-50 rounded-xl border border-amber-200">
                    <label class="block text-xs font-semibold text-amber-800 mb-1">คะแนนเกรด (เช่น 10, 9.5, 9):</label>
                    <input type="text" id="gradeScore" placeholder="เช่น 10 (Gem Mint)" class="w-full px-3 py-2 rounded-lg border border-amber-300 text-sm bg-white focus:outline-none">
                </div>
            </div>

            <!-- Section 4: Price & Currency -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <label class="block font-semibold text-slate-700 mb-1">💰 ราคาขาย (Price)</label>
                <div class="flex space-x-2">
                    <div class="relative flex-1">
                        <input type="number" id="price" step="0.01" required min="0.01" 
                            placeholder="0.00" 
                            class="w-full pl-8 pr-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-base font-semibold">
                        <span class="absolute left-3 top-2.5 text-slate-400 font-semibold">$</span>
                    </div>
                    <select id="currency" class="bg-slate-100 px-3 py-2.5 rounded-xl border border-slate-200 font-medium text-sm text-slate-700">
                        <option value="USD">USD ($)</option>
                        <option value="THB">THB (฿)</option>
                    </select>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" 
                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-3.5 rounded-2xl shadow-lg shadow-indigo-200 active:scale-[0.98] transition flex items-center justify-center space-x-2">
                <span id="btnText">🚀 บันทึกเข้าคิวโพสต์ขาย</span>
                <div id="btnSpinner" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
            </button>

        </form>
    </main>

    <script>
        let selectedFiles = [];
        let liffReady = false;

        async function initLiff() {
            try {
                await liff.init({ liffId: "2012509962-djqQR7a0" });
                liffReady = true;
            } catch (err) {
                console.log("Not running in LINE or LIFF error:", err);
            }
        }
        initLiff();

        function toggleGradedFields() {
            const conditionVal = document.getElementById('condition').value;
            const gradedBox = document.getElementById('gradedBox');
            if (conditionVal.startsWith('Graded')) {
                gradedBox.classList.remove('hidden');
            } else {
                gradedBox.classList.add('hidden');
            }
        }

        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            selectedFiles = [...selectedFiles, ...files];
            renderPreviews();
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderPreviews();
        }

        function renderPreviews() {
            const grid = document.getElementById('previewGrid');
            const counter = document.getElementById('photoCount');
            grid.innerHTML = '';
            counter.innerText = `${selectedFiles.length} รูป`;

            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                const div = document.createElement('div');
                div.className = 'relative aspect-square rounded-xl overflow-hidden border border-slate-200 group bg-slate-100';

                reader.onload = (e) => {
                    let label = index === 0 ? "หน้าการ์ด" : (index === 1 ? "หลังการ์ด" : `รูปที่ ${index + 1}`);
                    div.innerHTML = `
                        <img src="${e.target.result}" class="w-full h-full object-cover">
                        <button type="button" onclick="removeFile(${index})" class="absolute top-1 right-1 bg-red-500 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs shadow-md">✕</button>
                        <span class="absolute bottom-1 left-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded">${label}</span>
                    `;
                };
                reader.readAsDataURL(file);
                grid.appendChild(div);
            });
        }

        function updateTitleCount() {
            const len = document.getElementById('title').value.length;
            const counter = document.getElementById('titleCounter');
            counter.innerText = `${len}/80`;
            if (len > 80) counter.classList.add('text-red-500');
            else counter.classList.remove('text-red-500');
        }

        document.getElementById('itemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (selectedFiles.length === 0) {
                alert('กรุณาเลือกรูปภาพอย่างน้อย 1 รูปครับ (แนะนำรูปหน้า-หลังการ์ด)');
                return;
            }

            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            btn.disabled = true;
            btnText.innerText = 'กำลังอัปโหลดและเข้าคิว...';
            btnSpinner.classList.remove('hidden');

            let conditionFinal = document.getElementById('condition').value;
            if (conditionFinal.startsWith('Graded')) {
                const score = document.getElementById('gradeScore').value.trim();
                if (score) {
                    conditionFinal += ` Grade: ${score}`;
                }
            }

            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('price', document.getElementById('price').value);
            formData.append('currency', document.getElementById('currency').value);
            formData.append('condition', conditionFinal);

            selectedFiles.forEach((file) => {
                formData.append('files', file);
            });

            try {
                const res = await fetch('/api/submit-item', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('itemForm').classList.add('hidden');
                    const successBox = document.getElementById('successBox');
                    document.getElementById('successMsg').innerText = `การ์ด "${data.title}" เข้าคิวเรียบร้อย (คิวที่ #${data.item_id})`;
                    successBox.classList.remove('hidden');
                    window.scrollTo({ top: 0, behavior: 'smooth' });

                    // ถ้าเปิดใน LINE ให้ปิดหน้าต่างอัตโนมัติหลังบันทึกเสร็จ
                    if (liffReady && liff.isInClient()) {
                        setTimeout(() => {
                            liff.closeWindow();
                        }, 1500);
                    }
                } else {
                    alert('เกิดข้อผิดพลาด: ' + (data.message || 'ไม่สามารถบันทึกได้'));
                }
            } catch (err) {
                alert('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่อีกครั้ง');
            } finally {
                btn.disabled = false;
                btnText.innerText = '🚀 บันทึกเข้าคิวโพสต์ขาย';
                btnSpinner.classList.add('hidden');
            }
        });

        function resetForm() {
            selectedFiles = [];
            document.getElementById('itemForm').reset();
            renderPreviews();
            updateTitleCount();
            toggleGradedFields();
            document.getElementById('itemForm').classList.remove('hidden');
            document.getElementById('successBox').classList.add('hidden');
        }
    </script>
</body>
</html>
